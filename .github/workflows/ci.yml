name: CI

on:
  push:
    # Branches only, so pushing a v* tag does not start a second CI run.
    branches: ["**"]
  pull_request:
  # The release workflow runs these same checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  # The literal prefix keeps a called run from sharing the caller's group.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # Never let a test open a real browser.
      DO_IT_BROWSER: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build:web
      - run: bun run build:npm

name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches APP_VERSION and plugin.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check APP_VERSION
        run: |
          version="$(sed -nE "s/^export const APP_VERSION = ['\"]([^'\"]+)['\"].*/\1/p" packages/protocol/src/index.ts)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION '$version' in packages/protocol/src/index.ts"
            exit 1
          fi
      - name: Check the plugin version
        run: |
          version="$(jq -r .version .claude-plugin/plugin.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version '$version' in .claude-plugin/plugin.json"
            exit 1
          fi

  ci:
    name: CI
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build:npm
      - name: Check the built package version
        run: |
          version="$(jq -r .version dist/npm/package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::dist/npm is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Check the npm token owner
        run: |
          user="$(npm whoami)"
          if [ "$user" != "domir" ]; then
            echo "::error::The NPM_TOKEN secret belongs to the npm account '$user', not 'domir', the owner of claude-do-it. Replace the secret with a token from the domir account."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish with provenance
        working-directory: dist/npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
